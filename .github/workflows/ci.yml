name: CI

# PR / main push 마다 lint → typecheck → build 자동 실행.
# concurrency: 같은 PR에 새 푸시가 들어오면 이전 실행을 취소하여 Actions 사용량 절감.
#
# React + Vite + TypeScript 스택이라 DB/서비스 컨테이너는 불필요하고,
# 대신 타입 검증(tsc --noEmit)을 빌드 전에 강하게 건다.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # package-lock.json 기준 재현 가능한 설치. lock 파일이 있어야 통과.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # emit 없이 타입만 검사 — 빌드보다 먼저 타입 오류를 잡는다.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # 테스트 스크립트가 아직 없으면 통째로 스킵 (CI 는 녹색 유지).
      - name: Run tests (if configured)
        run: |
          if npm run | grep -qE '^  test$'; then
            npm test -- --run
          else
            echo "test 스크립트가 없어 건너뜁니다."
          fi

      - name: Upload build artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            coverage/
            dist/
          retention-days: 7
